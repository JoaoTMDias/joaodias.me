name: Get Latest Shows

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours, matching the cache duration
  workflow_dispatch: # Allow manual runs

permissions:
  contents: write # Required to commit generated files back

jobs:
  get-latest-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run get-latest-shows script
        run: npx tsx ./scripts/get-latest-shows.ts

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/shows scripts/src/data/shows.json
          git diff --cached --quiet || git commit -m "chore: update latest shows [skip ci]"
          git push
